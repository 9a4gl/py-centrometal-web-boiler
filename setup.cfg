[metadata]
name = py-centrometal-web-boiler
version = 0.0.61
author = Tihomir Heidelberg
author_email = tihomir.heidelberg@lite.hr
description = Python library to interact with Centrometal Boiler System.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/9a4gl/py-centrometal-web-boiler
project_urls =
    Bug Tracker = https://github.com/9a4gl/py-centrometal-web-boiler/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:

python_requires = >=3.11
install_requires =
    lxml>=6.1.3
    websockets>=13.0
    stomper>=0.4.3
    aiohttp>=3.14.5
    faust-cchardet>=3.2.0
    aiodns>=4.0.4
    pycares>=5.0.0

[options.packages.find]
where = src
